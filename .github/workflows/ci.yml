name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose --profile test build
      - run: docker compose run --rm test
      - run: docker compose up -d --wait web
      # 公開するファイルは 200 、開発用のファイルは配信しないことを確認します。
      - run: |
          for path in / /4.5.1.html /4.5.1-selectbox.html /4.5.1-selmodal.html /js/selmodal-page.js /css/selmodal.css; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")" = 200
          done
          for path in /package.json /src/auto-fill-date.ts /scripts/serve.ts; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")" = 404
          done
      - run: docker compose run --rm e2e
      - if: always()
        run: docker compose --profile test down
