# GitHub Pages (Jekyll) で公開しない、開発用のファイルです。
# 公開するデモページ (*.html, css/, js/) と README は対象外にしません。 js/ には src/*.ts から生成したファイルも含みます。
exclude:
  - compose.yaml
  - Dockerfile
  - eslint.config.mjs
  - node_modules/
  - package.json
  - package-lock.json
  - playwright.config.ts
  - playwright-report/
  - scripts/
  - src/
  - test-results/
  - tests/
  - tsconfig.json
